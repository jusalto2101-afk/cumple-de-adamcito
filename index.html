<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi Adam</title>
    <style>
        /* Estilo Rosita Pastel */
        body {
            background-color: #ffe4e1; /* Rosa pastel */
            color: #d87093;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            text-align: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            z-index: 10;
            max-width: 80%;
        }

        /* Globos Flotantes */
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 50px;
            height: 70px;
            background: #ffb6c1;
            border-radius: 50%;
            animation: float 8s infinite ease-in;
            opacity: 0.7;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
        }

        button {
            background-color: #ffb6c1;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        #mensaje-secreto {
            display: none;
            margin-top: 20px;
            font-style: italic;
            color: #db7093;
        }
    </style>
</head>
<body>

    <div class="balloon" style="left: 10%; background: #ffc0cb; animation-delay: 0s;"></div>
    <div class="balloon" style="left: 30%; background: #e6e6fa; animation-delay: 2s;"></div>
    <div class="balloon" style="left: 50%; background: #fff0f5; animation-delay: 4s;"></div>
    <div class="balloon" style="left: 70%; background: #f0fff0; animation-delay: 1s;"></div>
    <div class="balloon" style="left: 90%; background: #ffe4e1; animation-delay: 3s;"></div>

    <div class="container">
        <h1>¡feliz cumpleaños mi nene precioso🤍</h1>
        <p>Tengo algo que decirte...</p>
        
        <button onclick="mostrarMensaje()">Tócame</button>

        <div id="mensaje-secreto">
            "Adam, aunque la distancia nos separe hoy, mi corazón está con vos. 
            Sos lo más lindo que me pasó y espero que 'Amor de Siempre' 
            te recuerde cuánto te quiero."
        <mi nene precioso,hoy es un dia muy especial! es tu cumpleaños mi nene.. y bueno como es una fecha especial decidi hacerte esta pequeña pero llena de amor carta.
que decirte mi amor,pues que muchas gracias por estar conmigo y tambien gracias por seguir aca en la vida,seguir existiendo y viviendo por que eso es muy muy especial para mi ya que no me imagino un mundo sin vos mi nene precioso.
sos un chico lindisimo y tambien un amor y por eso decidi hacerte esta carta,espero y te guste mi amor por que la verdad le estoy poniendo todo mi amor y tiempo para que quede perfecta para vos,por que te lo mereces,mereces todo y mucho mas.
gracias por elegirme todos los dias y estar para mi siempre,te amo con todo mi corazon! muak muak feliz cumpleaños mi precioso.>

        <br><br>
        <iframe src="https://open.spotify.com/embed/track/2S7v2vXvGAsI6S8R57X86G?utm_source=generator&theme=0" 
        width="100%" height="152" frameBorder="0" allowfullscreen="" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <script>
        function mostrarMensaje() {
            var x = document.getElementById("mensaje-secreto");
            x.style.display = "block";
        }
    </script>
</body>
</html>
